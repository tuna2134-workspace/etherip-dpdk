# ---------------------------------------------------------------------------
# EtherIP tunnel configuration — annotated example
#
# Every key here maps to a field of `config.Config` in src/config.zig. The CLI
# equivalents are shown where they exist.
#
# Run `zig build run -- config-check` to validate a configuration and print the
# derived MTU arithmetic.
# ---------------------------------------------------------------------------

# --- tunnel endpoints (IPv6 only; this implementation has no IPv4 mode) -------

# Source address of every outer IPv6 packet. Must not be `::` (RFC 4291 2.2), a
# loopback address, a multicast address (RFC 4291 2.7), or IPv4-mapped
# (RFC 4291 2.5.2).
#   CLI: --local
local_ipv6 = "2001:db8:100::1"

# Destination address of every outer IPv6 packet.
#   CLI: --remote
remote_ipv6 = "2001:db8:200::1"

# --- MTUs: two independent values ---------------------------------------------

# MTU of the IPv6 interface carrying the tunnel. Must be at least 1280, the IPv6
# minimum link MTU (RFC 8200 Section 5), and must leave room for the IPv6 header,
# any reserved extension octets, the Fragment header, and at least one 8-octet
# aligned unit (RFC 8200 Sections 4.5 and 5).
#   CLI: --underlay-mtu
underlay_mtu = 1500

# Largest Ethernet frame accepted from the overlay interface. May EXCEED
# underlay_mtu: that is precisely the case IPv6 source fragmentation exists to
# handle. Must be <= 65533, because a reassembled IPv6 Payload Length is 16 bits
# and the 2-octet EtherIP header lives inside it (RFC 8200 Section 3).
#   CLI: --overlay-mtu
#
# With underlay_mtu = 1500:
#   1500 - 40 (IPv6) - 8 (Fragment)          = 1452 available
#   floor(1452 / 8) * 8                      = 1448 max fragment payload
#   40 + 8 + 1448                            = 1496 max outer packet  <= 1500
#   a 9000-octet frame becomes 9002 + 0 = 9002 octets, i.e. 7 fragments.
overlay_mtu = 9000

# --- fragmentation -----------------------------------------------------------

# When false, an EtherIP datagram that does not fit underlay_mtu is dropped
# instead of fragmented. Startup validation REJECTS overlay_mtu > underlay_mtu
# with fragmentation disabled, because that combination silently drops jumbo
# traffic.
fragmentation_enabled = true

# Octets reserved in the Per-Fragment Headers region for en-route-processed IPv6
# extension headers (RFC 8200 Section 4.5). No RFC mandates a value, and this
# implementation inserts none, so 0 is the only accepted value: RFC 8200 Section 4.5
# requires the IPv6 header's Next Header field to name the FIRST Per-Fragment
# header, so reserving octets without supplying real headers would emit packets a
# conformant receiver must reject.
#
# If you do add Hop-by-Hop, Routing or Destination Options headers ahead of the
# Fragment header, pass their octets and their type through
# fragment.EmitParams.per_fragment_ext / .per_fragment_ext_next_header, and keep
# this at 0.
#
# The MTU arithmetic does account for a reserve, for callers that encapsulate
# themselves:
#   underlay_mtu - 40 - reserved - 8 must leave >= 8 octets.
reserved_per_fragment_ext_bytes = 0

# --- reassembly --------------------------------------------------------------

# Milliseconds before an incomplete reassembly is abandoned. RFC 8200 Section 4.5
# requires abandonment "within 60 seconds of the reception of the first-arriving
# fragment", so the valid range is 1..60000 and anything above 60000 is rejected.
# Timing is measured from the FIRST fragment received for a datagram, not the most
# recent one.
reassembly_timeout_ms = 60000

# Maximum datagrams being reassembled concurrently. When the table is full,
# expired contexts are swept first, then the oldest context is evicted to admit
# the new one (documented implementation choice; see docs/RFC-ANALYSIS.md 5.8).
max_reassembly_packets = 256

# Maximum octets of fragment payload buffered across all reassemblies. Must be
# at least max_reassembly_packets * (overlay_mtu + 2) for the pool to fit.
max_reassembly_bytes = 16777216

# Maximum disjoint fragments tracked per datagram. Must be at least the number of
# fragments a full-size frame produces: ceil((overlay_mtu + 2) / max_frag_payload).
# With overlay_mtu = 9000 and a 1500-byte underlay that is 7; the default of 64 is
# comfortable headroom.
max_fragments_per_datagram = 64

# --- TCP MSS clamping: OPTIONAL -----------------------------------------------
# EtherIP works identically with this disabled. Clamping reduces the incidence
# of IPv6 fragmentation; it never replaces it, because a 9000-octet frame has no
# TCP MSS to shrink.

mss_clamping_enabled = false

# null = derive from the effective path MTU at run time:
#
#   clamp = effective_path_mtu - 40 (outer IPv6) - 2 (EtherIP)
#                       - inner_ip_header_len - inner_tcp_header_len
#
# With effective_path_mtu = 1500 that is 1418 for IPv4/TCP and 1398 for IPv6/TCP.
# With the 1280 minimum it is 1198 / 1178. The result is further limited by
# overlay_mtu and by any explicit value below.
#
# An explicit value is used only when it is LOWER than the computed target, so a
# mistaken large value cannot cause fragmentation.
mss_clamp = null

# Equivalent fixed value, if you prefer to pin it:
# mss_clamp = 1418

# --- outer IPv6 header (RFC 8200 Section 3) -----------------------------------
# These are implementation-specific; no RFC constrains them for this use.

# 0 is rejected: a Hop Limit of 0 forbids forwarding, which makes it useless.
hop_limit = 64

traffic_class = 0
flow_label = 0